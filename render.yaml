services:
  - type: web
    name: dineflow-backend-java
    env: docker
    dockerfilePath: ./backend-java/Dockerfile
    dockerContext: ./backend-java
    plan: free
    region: oregon
    healthCheckPath: /api/tables/stats/overview
    envVars:
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 604800000
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: TWILIO_WHATSAPP_NUMBER
        sync: false
      - key: FRONTEND_URL
        sync: false
